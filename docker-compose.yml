services:

  postgres:
    image: postgres:16-alpine
    container_name: eternity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eternitydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eternitydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eternity-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - HTTP_PORTS=8080
      - ConnectionStrings__EternityDb=Host=postgres;Database=${POSTGRES_DB:-eternitydb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - AdminSeed__Username=${ADMIN_SEED_USERNAME:-admin}
      - AdminSeed__Email=${ADMIN_SEED_EMAIL:-admin@eternity.com}
      - AdminSeed__Password=${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD is required}
      - AdminSeed__FullName=${ADMIN_SEED_FULLNAME:-Administrator}
      - CookieSettings__SameSiteMode=${COOKIE_SAME_SITE:-Strict}
      - CookieSettings__SecurePolicy=${COOKIE_SECURE_POLICY:-Always}
      - CorsSettings__AllowedOrigins__0=https://eternity.liusik.com
      - CorsSettings__AllowedOrigins__1=https://api.eternity.liusik.com
      - CorsSettings__AllowedOrigins__2=${CORS_ADDITIONAL_ORIGIN_1:-}
      - CorsSettings__AllowedOrigins__3=${CORS_ADDITIONAL_ORIGIN_2:-}
      - MediatR__LicenseKey=${MEDIATR_LICENSE_KEY:-}
    ports:
      - "5000:8080"
    volumes:
      - backend_logs:/app/logs
      - backend_data_protection_keys:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.http.services.eternity-backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eternity-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.http.services.eternity-frontend.loadbalancer.server.port=8080"

  peerjs:
    image: peerjs/peerjs-server:1.1.0-rc.2
    container_name: eternity-peerjs
    restart: unless-stopped
    command: ["peerjs", "--port", "9000", "--path", "/", "--key", "peerjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.http.services.eternity-peerjs.loadbalancer.server.port=9000"
      - "traefik.http.middlewares.eternity-peerjs-ws.headers.customrequestheaders.Connection=Upgrade"
      - "traefik.http.middlewares.eternity-peerjs-ws.headers.customrequestheaders.Upgrade=websocket"

volumes:
  postgres_data:
    name: eternity-postgres-data
  backend_logs:
    name: eternity-backend-logs
  backend_data_protection_keys:
    name: eternity-backend-data-protection-keys
